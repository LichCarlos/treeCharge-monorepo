services:
  postgres:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_DB: charge_development
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${PGADMINPASSWORD:?Generate .env first}
    ports:
      - "127.0.0.1:15432:5432"
    volumes:
      - charge_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d charge_development"]
      interval: 5s
      timeout: 3s
      retries: 15
volumes:
  charge_pg:
